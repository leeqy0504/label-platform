[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "label-platform"
version = "0.1.0"
description = "Dataset, Label Studio, and UnitTrain management platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "label-studio-sdk>=1.0.5,<2",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4",
    "pycocotools>=2.0.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "redis>=6,<7",
    "rq>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
label-platform = "label_platform.cli:main"
unitrain-api = "unitrain_api.cli:main"
unitrain-train = "cli.train:main"
unitrain-predict = "cli.predict:main"
unitrain-export = "cli.export:main"

[tool.setuptools.packages.find]
include = ["label_platform*", "unitrain*", "unitrain_api*", "cli*"]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
    "types-pycocotools>=2.0.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the Compose PostgreSQL and Redis services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["label_platform"]
plugins = ["pydantic.mypy"]
strict = true
